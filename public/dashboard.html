<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - BlogHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>


<nav class="navbar navbar-expand-md navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="#"
        >
            BlogHub Dashboard
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navMenu"
            aria-controls="navMenu"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse flex-grow-0" id="navMenu">

            <div class="d-flex flex-column flex-md-row mt-3 mt-md-0 gap-2">

                <a
                    href="profile.html"
                    class="btn btn-outline-light"
                >
                    Profile
                </a>

                <button
                    onclick="logout()"
                    class="btn btn-danger"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>

</nav>


<main class="container py-5">


    <div class="dashboard-header mb-4">

        <h1>
            Welcome,
            <span id="userName"></span> 👋
        </h1>

        <p class="text-muted">
            Manage your personal blogs
        </p>

    </div>


    <!-- CREATE BLOG -->

    <div class="card dashboard-card p-4 mb-5">

        <h3 class="mb-3">
            ✍️ Create New Blog
        </h3>


        <form id="blogForm">

            <label class="form-label">
                Blog Title
            </label>

            <input
                type="text"
                id="title"
                class="form-control mb-3"
                placeholder="Enter blog title"
                required
            >


            <label class="form-label">
                Blog Content
            </label>

            <textarea
                id="content"
                class="form-control mb-3"
                rows="6"
                placeholder="Write your blog content..."
                required
            ></textarea>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Publish Blog
            </button>

        </form>


        <div
            id="blogMessage"
            class="mt-3"
        ></div>

    </div>


    <!-- MY BLOGS -->

    <div>

        <h2 class="mb-4">
            📚 My Blogs
        </h2>

        <div id="blogsContainer"></div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
